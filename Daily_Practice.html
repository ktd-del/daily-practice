<!DOCTYPE html>
<html lang="en">
<head>

</div>

<div class="card">

<label><input type="checkbox"> Show compassion?</label>

<h3>Reflection</h3>
<p>What challenged me today?</p>
<textarea></textarea>

<textarea></textarea>

<textarea></textarea>
</div>

</html>
